[project]
name = "binance-api-rag"
version = "0.1.0"
description = "RAG assistant over Binance's Spot API docs: hybrid search (pgvector + Postgres full-text) with cited answers and a retrieval eval."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
rag = "rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
